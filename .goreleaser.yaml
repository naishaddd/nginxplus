version: 2
project_name: nginxpp
builds:
  - main: ./cmd/nginxpp
    binary: nginxpp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
